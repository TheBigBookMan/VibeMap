openapi: 3.0.3

info:
  title: VibeMeet API
  version: 1.0.0
  description: |
    **VibeMeet** is a location-first platform for creating and joining small, casual in-person meetups — called **"plans"** — like "Pool at 7pm", "Bouldering tonight", or "Coffee and boardgames Saturday". Unlike formal event platforms (Eventbrite, Meetup), VibeMeet is designed around spontaneity and small groups. Think of it as the answer to "I want to do something tonight but don't want to scroll through 50-person networking mixers."
  
    Users discover plans through a scrollable feed or an interactive map, join with a single tap, and immediately enter a real-time group chat to coordinate details. A subscription model (Free + Premium via Stripe) gates advanced features, and an ML-powered moderation pipeline keeps content safe.

servers:
  - description: Local development server
    url: http://localhost:3000/v1
  - description: Staging server (testing)
    url: https://staging-api.vibemeet.com/v1
  - description: Production server
    url: https://api.vibemeet.com/v1

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JSON Web Token (JWT) bearer authentication.
        
        ## Retrieving Tokens
        Get an Access Token and Refresh Token by calling `POST /auth/login` with your email and password or using google mail via firebase.
        
        ```json
        Response:
        {
          "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "expiresIn": 900
        }
        ```
        
        ## Using Access Token
        Include the access token in the `Authorization` header for all authenticated requests.
        
        `Authorization: Bearer eyHASDJljhSD`
        
        ## Token Lifetime
        - Access Token: Expires after 15 minutes
        - Refresh Token: Expires after 7 days
        
        ## Refreshing Tokens
        When your Access Token expires, use the `POST /auth/refresh` with your refresh token to obtain a new Access Token without re-authentication.
        
        ```json
        Response:
        {
          "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "expiresIn": 900
        }
        ```
        
        ## Token Payload
        The JWT payload contains the following claim:
        ```json
        {
          "sub": "usr_abc123",
          "email": "user@example.com",
          "role": "user",
          "tier": "premium",
          "emailVerified": true,
          "iat": 1709251200,
          "exp": 1709252100
        }
        ```
        
        ## Error Responses

        ### 401 Unauthorized - Missing Token
        ```json
        {
          "error": {
            "code": "UNAUTHORIZED",
            "message": "Authentication required",
            "details": "Include a valid access token in the Authorization header"
          }
        }
        ```

        ### 401 Unauthorized - Invalid Token
        ```json
        {
          "error": {
            "code": "INVALID_TOKEN",
            "message": "Invalid authentication token",
            "details": "Token signature verification failed"
          }
        }
        ```

        ### 401 Unauthorized - Expired Token
        ```json
        {
          "error": {
            "code": "TOKEN_EXPIRED",
            "message": "Access token has expired",
            "details": "Use the refresh token to obtain a new access token"
          }
        }
        ```

  schemas:
    User:
      type: object
      description: A VibeMeet user account
      required:
        - ref
        - email
        - firstName
        - lastName
        - role
        - subscription
        - dateCreated
      properties:
        ref:
          type: string
          description: Unique user identifier
          example: usr_abc123
          pattern: '^usr_[a-zA-z0-p]+$'
        email:
          type: string
          format: email
          description: The users email used for email verification
          example: 'username@email.com'
        firstName:
          type: string
          description: The users first name
          maxLength: 20
          example: John
        lastName:
          type: string
          description: The users last name
          maxLength: 50
          example: Doe
        bio:
          type: string
          description: Users bio
          maxLength: 250
          nullable: true
          example: "I love to travel and meet people."
        homeCity:
          type: string
          description: Human readable location of home city
          nullable: true
          example: "New York City, New York"
        avatarUrl:
          type: string
          format: uri
          description: The URI for where the avatar is hosted
          nullable: true
          example: 'https://aws.s3.vibemeet.com/avatars/asd2d2d'
        interests:
          type: array
          description: Interests the user has selected
          items:
            type: object
            properties:
              interestRef:
                type: string
              name:
                type: string
              description:
                type: string
        friendCount:
          type: integer
          description: Count of all users friends
          example: 12
        followCount:
          type: integer
          description: Count of all followers
          example: 5
        followingCount:
          type: integer
          description: Count of all following
          example: 34
        plansAttended:
          type: integer
          description: Count of all plans user has attended
          example: 104
        emailVerified:
          type: boolean
          description: Signify if the user has verified their email
          example: true
          default: false
        role:
          type: string
          enum: ["user", "moderator", "admin"]
          description: Signifies the users privileges
          default: "user"
        subscription:
          type: string
          enum: ["free", "premium"]
          description: Strip subscription
          default: "free"
          example: "premium"
        lastLogin:
          type: string
          format: date-time
          description: The last login time
          example: '2024-02-11T14:30:00Z'
        dateCreated:
          type: string
          format: date-time
          description: Timestamp for when user created account
          example: '2024-02-11T14:30:00Z'

    UserSummary:
      type: object
      description: A summary of User which is used throughout the app.
      required:
        - ref
        - firstName
        - lastName
      properties:
        ref:
          type: string
          description: Ref id for the user
          example: 'usr_123'
        firstName:
          type: string
          description: Users first name
          example: "Joshn"
        lastName:
          type: string
          description: Users last name
          example: "Doe"
        avatarUrl:
          type: string
          format: uri
          description: The URI for where the avatar is hosted
          nullable: true
          example: 'https://aws.s3.vibemeet.com/avatars/asd2d2d'

    Plan:
      type: object
      description: A plan for a specific organised event
      required:
        - ref
        - createdBy
        - category
        - title
        - locationName
        - visibility
        - status
        - startTime
        - endDate
        - createdAt
      properties:
        ref:
          type: string
          description: Ref id for the plan
          example: 'plan_123abc'
          pattern: '^usr_[a-zA-z0-p]+$'
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        category:
          $ref: "#/components/schemas/Category"
        interests:
          type: array
          description: The interests associated with the plan
          items:
            type: string
          example: ["sport", "soccer"]
        title:
          type: string
          description: Name of the plan
          example: "Soccer game"
          maxLength: 20
          minLength: 3
        description:
          type: string
          description: Description for the plan
          nullable: true
          example: "Quick 5v5 side game"
          maxLength: 250
        locationName:
          type: string
          description: Human readable location for the plan
          example: 'Port Elliot, SA'
        maxAttendees:
          type: integer
          description: Max number of users that can join the plan
          default: 8
          example: 5
          minLength: 2
        attendeeCount:
          type: integer
          description: The number of attendees who have said they are going. References plan_attendee for status = 'confirmed'
          example: 3
        visibility:
          type: string
          description: Which users can view the plan
          enum: ["public", "members", "premium", "friends_only"]
          example: "premium"
          default: "public"
        status:
          type: string
          description: The current status of the plan
          enum: ["draft", "published", "cancelled", "completed"]
          example: "cancelled"
          default: "draft"
        startTime:
          type: string
          format: date-time
          description: The date and time when the plan starts
          example: "2024-02-11T14:30:00Z"
        endTime:
          type: string
          format: date-time
          description: The date and time when the plan ends
          example: "2024-02-11T16:30:00Z"
        coverImageUrl:
          type: string
          format: uri
          description: The URI for the cover image of the plan
          nullable: true
          example: 'https://aws.s3.vibemeet.com/avatars/asd2d2d'
        images:
          type: array
          description: The images uploaded for the plan
          items:
            type: object
            properties:
              url:
                type: string
                description: The url for where the image is hosted
              display_order:
                type: integer
                description: For knowing the ordering of the image
        location:
          type: object
          description: Location information for the plan
          properties:
            text:
              type: string
              description: Human-readable location
              example: "Joe's Bar, 123 Main St, Adelaide"
            coords:
              type: object
              nullable: true
              description: GPS coordinates (optional)
              properties:
                lat:
                  type: number
                  format: double
                  example: -34.9285
                lng:
                  type: number
                  format: double
                  example: 138.6007
        customFields:
          type: object
          description: Flexible JSON object for custom plan data
          additionalProperties: true
          nullable: true
          example:
            dietaryRestrictions: "Vegetarian options available"
            ageRange: "18+"
        qrCodeAvailable:
          type: boolean
          description: Whether QR code for check-in is available (10 min before start)
          example: false
        rules:
          type: string
          nullable: true
          maxLength: 500
          description: House rules or notes from the host
          example: "BYO drinks, beginners welcome"
        updatedAt:
          type: string
          format: date-time
          description: When the plan was last updated
          example: "2024-02-11T15:45:00Z"
        createdAt:
          type: string
          format: date-time
          description: The date and time the plan was created

    ChatMessage:
      type: object
      description: Messages related to a plan
      required:
        - ref
        - userRef
        - planRef
        - content
        - messageType
        - createdAt
      properties:
        ref:
          type: string
          description: UID of the message
          example: 'chat_12323'
        userRef:
          $ref: '#/components/schemas/UserSummary'
        planRef:
          type: string
          description: ref for the plan
        content:
          type: string
          description: Content of the message
          example: 'Hey, how is everyone?'
          maxLength: 500
        messageType:
          type: string
          enum: ["text", "image", "system"]
          description: The type of message sent
        createdAt:
          type: string
          format: date-time
          description: Date and time the message was sent
          example: "2024-02-11T15:45:00Z"

    Notification:
      type: object
      description: Notifications sent to a user
      required:
        - ref
        - userRef
        - type
        - title
        - body
        - actionUrl
        - createdAt
      properties:
        ref:
          type: string
          description: Notification UID
          example: 'not_123'
        userRef:
          type: string
          description: UID for the user
          example: 'usr_123'
        type:
          type: string
          enum: ["plan_event", "chat_event", "system"]
          example: "chat_event"
          description: The type of notification
        title:
          type: string
          description: Title of the notification
          example: "Plan upcoming tonight"
          maxLength: 20
          minLength: 3
        body:
          type: string
          description: Description of notification
          example: "There is a plan near you tonight for going for drinks"
          maxLength: 200
          nullable: true
        data:
          type: string
          format: JSON
          description: Extra information for the notification
          nullable: true
        actionUrl:
          type: string
          format: URI
          description: If the notification can redirect the user to take action
          example: 'https://app.vibemeet.com/profilePage'
        readAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-02-11T15:45:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-02-11T15:45:00Z"

    Category:
      type: object
      description: Category for plans to be assigned to
      required:
        - ref
        - name
        - iconUrl
      properties:
        ref:
          type: string
          description: UID for category
          example: 'cat_123'
        name:
          type: string
          description: Name of the category
          maxLength: 20
          minLength: 3
          example: "Sport"
        description:
          type: string
          description: More information about the category
          maxLength: 50
          nullable: true
          example: "Physical activity with groups"
        iconUrl:
          type: string
          format: URI
          description: The URI for where the icon is hosted
          example: "https://app.vibemeet.com/hosted-images/icon"

    Interest:
      type: object
      description: Interests that users can assign and plans can be assigned to
      required:
        - ref
        - name
      properties:
        ref:
          type: string
          description: UID for the interest
          example: 'int_123'
        name:
          type: string
          description: Title for the interest
          example: "Active"
          maxLength: 20
          minLength: 3
        description:
          type: string
          description: Further information about the interest
          nullable: true
          maxLength: 500
          example: "For fitness and sport related plans"

    Error:
      type: object
      description: Standard error response throughout the application
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Machine-readable error code
          format: UPPER_SNAKE_CASE
          example: FORBIDDEN
        message:
          type: string
          description: Human-readable error message
          example: Authentication required
        details:
          type: string
          nullable: true
          description: Extra information for troubleshooting
          example: "Invalid access token"
        field:
          type: string
          nullable: true
          description: Field causing the error
          example: 'password'
        fields:
          type: object
          description: If multiple fields causing error
          nullable: true
          additionalProperties:
            type: string
          example:
            email: "Email required"
            password: "Password must be more than 3 characters"
        timestamp:
          type: string
          format: date-time
          description: Date and time for when error occurred
          example: "2024-02-11T14:30:00Z"

    PaginationResponse:
      type: object
      description: Pagination metadata for cursor-based pagination
      required:
        - cursor
        - hasMore
        - limit
      properties:
        cursor:
          type: string
          nullable: true
          description: Opaque cursor for next page (null if no more data)
          example: eyNASDnASDJKNl
        hasMore:
          type: boolean
          description: If there is more data exists
          example: false
        limit:
          type: integer
          description: Number of items per page
          example: 20

paths:
  ## Authentication Endpoints

  /auth/register:
    post:
      tags:
        - Authentication
        - Signup/Register account
      summary: register a new user account
      description: |
        Register new account with email and password.
        Rate Limit: 3 requests per hour per IP address
        Process:
          1. Account is created with `emailVerified: false`
          2. Verification email is sent to the provided address
          3. User must verify email before creating/joining plans
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: john.doe@test.com
                password:
                  type: string
                  minLength: 8
                  description: User password
                  example: Password123
                firstName:
                  type: string
                  description: User's first name
                  example: John
                lastName:
                  type: string
                  description: User's last name
                  example: Doe
      responses:
        '201':
          description: Account has been created successfully and verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  message:
                    type: string
                    example: Verification email sent to jhon.doe@test.com
              example:
                user:
                  ref: user_asd
                  email: john.doe@test.com
                  firstName: John
                  lastName: Doe
                  emailVerified: false
                  role: user
                  tier: free
                  createdAt: "2024-02-11T14:30:00Z"
                message: Verification email sent to jhon.doe@test.com
        '400':
          description: Validation error with signing up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: Request validation failed
                details: Password not 8 characters long
                fieldName: password
                timestamp: "2024-02-11T14:30:00Z"
        '409':
          description: Duplication error with email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: DUPLICATE_RESOURCE
                message: Resource already exists
                details: The email is already registered
                fieldName: email
                timestamp: "2024-02-11T14:30:00Z"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Rate limit exceeded
                details: You have exceeded the rate limit of 3 requests per 1 hour, please wait an hour.
                timestamp: "2024-02-11T14:30:00Z"

  /auth/login:
    post:
      tags:
        - Authentication
        - Sign in with registered email
      summary: Login with a registered email and password
      description: |
        Sign in to the app with a registered email and password to receive access token and refresh token.
        Rate Limit: 5 requests every 15 minutes per IP
        Process:
          1. Sign in with email and password
          2. If authenticated, return refresh token and access token
        Access token lifetime: 15 minutes
        Refresh token lifetime: 7 days
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's registered email
                  example: john.doe@test.com
                password:
                  type: string
                  description: User's registered password
                  example: password12
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                  - user
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: JWT access token (15 minute expiry)
                    example: eyASNDASDOJNASD
                  refreshToken:
                    type: string
                    description: Refresh token for JWT (7 day expiry, single use)
                    example: eyADLJNADSF
                  user:
                    $ref: '#/components/schemas/User'
                  expiresIn:
                    type: integer
                    description: Access token lifetime in seconds
                    example: 900
                example:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    ref: usr_abc123
                    email: john.doe@example.com
                    displayName: John Doe
                    firstName: John
                    lastName: Doe
                    avatarUrl: https://s3.amazonaws.com/vibemeet/avatars/usr_abc123.jpg
                    bio: Coffee enthusiast
                    homeCity: Adelaide, SA
                    interests: [ "bouldering", "coffee" ]
                    role: user
                    tier: premium
                    emailVerified: true
                    createdAt: "2024-01-15T10:00:00Z"
                    updatedAt: "2024-02-11T14:30:00Z"
                  expiresIn: 900
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Invalid credentials, please try again.
                details: Please input valid credentials.
                timestamp: "2024-02-11T14:30:00Z"
        '403':
          description: Banned from application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BANNED_USER
                message: User is banned from VibeMeet
                details: The User is currently banned for specific reasons
                timestamp: "2024-02-11T14:30:00Z"
        '429':
          description: Rate limit error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Rate limit has been exceeded
                details: 5 requests every 15 minutes per IP, please wait 15 minutes before trying again.
                timestamp: "2024-02-11T14:30:00Z"

  /auth/refresh:
    post:
      tags:
        - Authentication
        - Refresh the JWT access token
      summary: Refresh the JWT access token
      description: |
        Refresh the JWT access token by sending a request with the refresh token received when signing in.
        Rate limit: 10 requests per hour per user
        
        Process:
          1. Send the refresh token
          2. Receive new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh token
                  example: eyASDASJNDS
      responses:
        '200':
          description: Refresh token successfully retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                  - refreshToken
                  - accessToken
                  - expiresIn
                properties:
                  refreshToken:
                    type: string
                    description: Refresh token
                    example: eyASDJNASDnASD
                  accessToken:
                    type: string
                    description: JWT access token
                    example: eyNASDOJNASD
                  expiresIn:
                    type: integer
                    description: Refresh token lifecycle in seconds
                    example: 900
                example:
                  refreshToken: eyASDASD
                  accessToken: eyASDJNASD
                  expiresIn: 900
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  value:
                    error:
                      code: INVALID_TOKEN
                      message: Invalid refresh token
                      details: The refresh token is malformed or has been revoked
                      timestamp: "2024-02-11T14:30:00Z"
                expiredToken:
                  value:
                    error:
                      code: TOKEN_EXPIRED
                      message: Refresh token has expired
                      details: Please log in again to obtain a new refresh token
                      timestamp: "2024-02-11T14:30:00Z"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Too many refresh requests
                  details: You have exceeded the refresh rate limit. Please try again in 60 minutes.
                  retryAfter: 3600
                  timestamp: "2024-02-11T14:30:00Z"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout and invalidate tokens
      description: |
        Invalidate the current session's refresh token.
        
        The access token remains valid until it expires (15 minutes).
        The refresh token is immediately revoked, preventing future token refresh.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logout successful. Refresh token invalidated.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
                  details: Include a valid access token in the Authorization header
                  timestamp: "2024-02-11T14:30:00Z"

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Send a password reset email to the user.
        
        Rate Limit: 3 requests per hour per IP address
        Security Note: For security, this endpoint always returns 200 even if the email doesn't exist.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address associated with the account
                  example: john.doe@example.com
      responses:
        '200':
          description: If the email exists, a reset link has been sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account exists with this email, a password reset link has been sent
              example:
                message: "If an account exists with this email, a password reset link has been sent"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Too many password reset requests
                  details: Please try again in 60 minutes
                  retryAfter: 3600
                  timestamp: "2024-02-11T14:30:00Z"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: |
        Set a new password using the reset token from the email.
        
        Rate Limit: 5 requests per hour per token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: Reset token from the email link
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                newPassword:
                  type: string
                  minLength: 8
                  description: New password (min 8 characters)
                  example: NewSecurePass456
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password has been reset successfully. You can now log in with your new password.
              example:
                message: "Password has been reset successfully. You can now log in with your new password."
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  value:
                    error:
                      code: INVALID_TOKEN
                      message: Invalid reset token
                      details: The reset token is invalid or has already been used
                      timestamp: "2024-02-11T14:30:00Z"
                expiredToken:
                  value:
                    error:
                      code: TOKEN_EXPIRED
                      message: Reset token has expired
                      details: Reset tokens expire after 1 hour. Please request a new one.
                      timestamp: "2024-02-11T14:30:00Z"

  /auth/verify-email/{token}:
    get:
      tags:
        - Authentication
      summary: Verify email address
      description: |
        Verify user's email address using the token from the verification email.
        
        This is typically called by clicking a link in the verification email.
        After verification, the user can create and join plans.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Email verification token
          schema:
            type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully! You can now create and join plans.
                  user:
                    $ref: '#/components/schemas/User'
              example:
                message: "Email verified successfully! You can now create and join plans."
                user:
                  ref: usr_abc123
                  email: john.doe@example.com
                  emailVerified: true
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  value:
                    error:
                      code: INVALID_TOKEN
                      message: Invalid verification token
                      timestamp: "2024-02-11T14:30:00Z"
                alreadyVerified:
                  value:
                    error:
                      code: ALREADY_VERIFIED
                      message: Email address is already verified
                      timestamp: "2024-02-11T14:30:00Z"

  ## User endpoints
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user's profile
      description: |
        Retrieve the authenticated user's complete profile information.
        
        Includes personal details, subscription status, notification preferences,
        and account settings.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                ref: usr_abc123
                email: john.doe@example.com
                displayName: John Doe
                firstName: John
                lastName: Doe
                bio: Coffee enthusiast and weekend hiker
                avatarUrl: https://s3.amazonaws.com/vibemeet/avatars/usr_abc123.jpg
                homeCity: Adelaide, SA
                interests: [ "bouldering", "coffee", "board games" ]
                role: user
                tier: premium
                emailVerified: true
                friendCount: 47
                followerCount: 123
                followingCount: 89
                createdAt: "2024-01-15T10:00:00Z"
                updatedAt: "2024-02-11T14:30:00Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
                  details: Include a valid access token in the Authorization header
                  timestamp: "2024-02-11T14:30:00Z"
        '404':
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: USER_NOT_EXIST
                  message: User does not exist
                  details: The user does not exist in the database
                  timestamp: "2024-02-11T14:30:00Z"
    patch:
      tags:
        - Users
      summary: Update current user's profile
      description: |
        Update the authenticated user's profile fields.
        All fields are optional. Only provided fields will be updated.
        Note: Email changes require re-verification.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  maxLength: 50
                  nullable: true
                  description: First name
                  example: John
                lastName:
                  type: string
                  maxLength: 50
                  nullable: true
                  description: Last name
                  example: Smith
                bio:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Short bio or description
                  example: Coffee enthusiast and weekend hiker. Always up for outdoor adventures!
                homeCity:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: Home city for display purposes
                  example: Adelaide, SA
                homeLocation:
                  type: object
                  nullable: true
                  description: GPS coordinates for distance calculations (never shown publicly)
                  properties:
                    lat:
                      type: number
                      format: double
                      minimum: -90
                      maximum: 90
                      example: -34.9285
                    lng:
                      type: number
                      format: double
                      minimum: -180
                      maximum: 180
                      example: 138.6007
                interests:
                  type: array
                  items:
                    type: string
                  minItems: 0
                  maxItems: 20
                  description: Interest tags for notification matching
                  example: [ "bouldering", "coffee", "board games", "hiking" ]
                notificationPreferences:
                  type: object
                  description: Notification settings
                  properties:
                    enabled:
                      type: boolean
                      description: Master notification toggle
                      example: true
                    matchingTags:
                      type: array
                      items:
                        type: string
                      description: Only notify for plans with these tags
                      example: [ "bouldering", "hiking" ]
                    radiusKm:
                      type: integer
                      enum: [ 2, 5, 10, 25, 50 ]
                      description: Notification radius in kilometers
                      example: 10
                    quietHours:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          example: true
                        start:
                          type: string
                          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                          description: Start time in HH:mm format (24-hour)
                          example: "22:00"
                        end:
                          type: string
                          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                          description: End time in HH:mm format (24-hour)
                          example: "07:00"
            examples:
              updateBasicInfo:
                summary: Update basic profile info
                value:
                  displayName: John Smith
                  bio: Coffee enthusiast and weekend hiker
                  homeCity: Adelaide, SA
              updateInterests:
                summary: Update interests
                value:
                  interests: [ "bouldering", "coffee", "board games", "hiking", "photography" ]
              updateNotifications:
                summary: Update notification preferences
                value:
                  notificationPreferences:
                    enabled: true
                    matchingTags: [ "bouldering", "hiking" ]
                    radiusKm: 10
                    quietHours:
                      enabled: true
                      start: "22:00"
                      end: "07:00"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                ref: usr_abc123
                email: john.doe@example.com
                displayName: John Smith
                bio: Coffee enthusiast and weekend hiker
                homeCity: Adelaide, SA
                interests: [ "bouldering", "coffee", "board games", "hiking" ]
                role: user
                tier: premium
                emailVerified: true
                updatedAt: "2024-02-11T15:45:00Z"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFirstName:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed
                      details: First name must be between 3 and 50 characters
                      field: firstName
                      timestamp: "2024-02-11T14:30:00Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete user account
      description: |
        Permanently delete the authenticated user's account and all associated data.
        
        GDPR Compliance:
        - All personal data is removed from the database
        - Profile photos are deleted from S3
        - Plans created by the user are cancelled
        - Chat messages are anonymized (author replaced with "Deleted User")
        - The user is immediately logged out
        
        This action cannot be undone.
        
        Confirmation Required: Include the user's email in the request body to confirm deletion.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmEmail
              properties:
                confirmEmail:
                  type: string
                  format: email
                  description: User's email address for confirmation
                  example: john.doe@example.com
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Optional reason for account deletion (for feedback)
                  example: Moving to a different platform
      responses:
        '204':
          description: Account deleted successfully. User has been logged out.
        '400':
          description: Email confirmation mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Email confirmation does not match
                  details: The provided email does not match your account email
                  field: confirmEmail
                  timestamp: "2024-02-11T14:30:00Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/notifications:
    get:
      tags:
        - Users
      summary: List user's notifications
      description: |
        Get a paginated list of the authenticated user's notifications.
        
        Notifications are sorted by creation date (newest first).
        Unread notifications appear at the top.
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: Number of notifications per page
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
          example: 20
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
            nullable: true
          example: eyJpZCI6Im5vdF94eXo3ODkiLCJjcmVhdGVkQXQiOiIyMDI0LTAyLTExVDAwOjAwOjAwWiJ9
        - name: unreadOnly
          in: query
          description: Filter to show only unread notifications
          schema:
            type: boolean
            default: false
          example: false
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
              example:
                data:
                  - ref: not_abc123
                    type: plan_match
                    title: New plan near you
                    body: Bouldering at The Ledge - 3.2 km away, tonight at 6pm
                    data:
                      planRef: pln_xyz789
                      planTitle: Bouldering at The Ledge
                      distance: 3.2
                    actionUrl: /plans/pln_xyz789
                    read: false
                    readAt: null
                    createdAt: "2024-02-11T14:30:00Z"
                  - ref: not_def456
                    type: plan_joined
                    title: Someone joined your plan
                    body: Jake joined Pool at Joe's Bar (5/8 spots)
                    data:
                      planRef: pln_abc123
                      userId: usr_xyz789
                      userName: Jake
                    actionUrl: /plans/pln_abc123
                    read: true
                    readAt: "2024-02-11T15:00:00Z"
                    createdAt: "2024-02-11T13:15:00Z"
                pagination:
                  cursor: eyJpZCI6Im5vdF9kZWY0NTYiLCJjcmVhdGVkQXQiOiIyMDI0LTAyLTExVDEzOjE1OjAwWiJ9
                  hasMore: true
                  limit: 20
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/notifications/read-all:
    post:
      tags:
        - Users
      summary: Mark all notifications as read
      description: Mark all of the authenticated user's notifications as read.
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: All notifications marked as read
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/notifications/{notificationRef}/read:
    patch:
      tags:
        - Users
      summary: Mark notification as read
      description: Mark a specific notification as read.
      security:
        - BearerAuth: [ ]
      parameters:
        - name: notificationRef
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
          example: not_abc123